<!doctype html>
<html lang="{{ page.lang | default: 'zh' }}">
  {% include head.html %}
  <body class="page-{{ page.nav_key | default: 'content' }} lang-{{ page.lang | default: 'zh' }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'en' %}Skip to content{% else %}跳至正文{% endif %}</a>
    {% include header.html %}

    <main id="main-content" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/site.js?v=20260920-5' | relative_url }}" defer></script>
  </body>
</html>

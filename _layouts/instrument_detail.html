---
layout: base
---
<article class="instrument-detail shell">
  <header class="instrument-detail-header">
    <div>
      <p class="eyebrow">{% if page.lang == 'en' %}EXPERIMENTAL FACILITY{% else %}实验装置{% endif %}</p>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="detail-subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
    <a class="back-link" href="{% if page.lang == 'en' %}{{ '/en/instruments/' | relative_url }}{% else %}{{ '/instruments/' | relative_url }}{% endif %}">← {% if page.lang == 'en' %}All facilities{% else %}全部仪器{% endif %}</a>
  </header>
  {% if page.image %}
    <figure class="instrument-detail-image">
      <img src="{{ '/assets/images/instruments/' | append: page.image | relative_url }}" alt="{{ page.title }}">
    </figure>
  {% endif %}
  <div class="detail-body prose">
    {{ content }}
  </div>
</article>

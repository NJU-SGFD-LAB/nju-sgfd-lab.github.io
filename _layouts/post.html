---
layout: base
---
<article class="post-page shell">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time>
      {% if page.author %}<span>{{ page.author }}</span>{% endif %}
      {% if page.demo %}<span class="demo-badge">DEMO</span>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="page-intro">{{ page.excerpt_text }}</p>{% endif %}
  </header>
  <div class="post-body prose">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← 返回博客</a>
  </footer>
</article>

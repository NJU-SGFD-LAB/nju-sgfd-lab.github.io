title: Nanjing University Geophysical Fluid Dynamics Laboratory
title_zh: 南京大学地球流体力学实验室
title_en: Nanjing University Geophysical Fluid Dynamics Laboratory
short_title: NJU GFD Lab
description: Student-led geophysical fluid dynamics experiments and numerical modeling at Nanjing University.
description_zh: 南京大学地球流体力学实验室，通过自主实验装置与数值模拟探索地球流体运动。
affiliation_zh: 南京大学大气科学学院
affiliation_en: School of Atmospheric Sciences, Nanjing University
url: "https://nju-gfd-lab.github.io"
baseurl: ""

theme: minima
plugins:
  - jekyll-feed

collections:
  instruments:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: zh
  - scope:
      path: ""
      type: instruments
    values:
      layout: instrument_detail

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - PROJECT_HANDOFF.md
  - README.md
  - UPDATE_AND_DEPLOY.md
  - vendor

en:
  eyebrow: School of Atmospheric Sciences · Nanjing University
  title: Nanjing University Geophysical Fluid Dynamics Laboratory
  tagline: Through self-developed fluid-dynamics apparatus and numerical models, we explore the fundamental dynamics of the atmosphere, oceans, and rotating stratified fluids.
  intro_title: Understanding geophysical flows from the laboratory bench
  intro: Founded by students in 2012 and formally established in 2014, the NJU GFD Lab is a hands-on research platform shaped and managed with active student participation. We design experimental apparatus, conduct fluid-dynamics experiments, and develop numerical models to investigate the physical mechanisms governing flows in the atmosphere, oceans, and rotating planetary systems.
  research_label: Research directions
  research:
    - index: "01"
      title: Laboratory Simulation of Tropical Cyclogenesis
      description: Controlled fluid experiments are used to investigate the fundamental dynamical and thermodynamical processes involved in tropical cyclone formation.
    - index: "02"
      title: Wave–Current Interaction
      description: Laboratory experiments and numerical simulations are combined to study the fundamental interactions between waves and background flows.

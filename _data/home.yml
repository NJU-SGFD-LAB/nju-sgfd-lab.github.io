zh:
  eyebrow: 南京大学 · 大气科学学院
  title: 南京大学地球流体力学实验室
  tagline: 我们自主研制流体实验装置、开发数值模拟程序，探索大气、海洋与旋转层结流体运动的基本规律。
  intro_title: 从实验桌出发，理解地球流体
  intro: 南京大学地球流体力学实验室起源于2012年，于2014年正式建成，是由学生参与建设和管理的科研实践平台。我们鼓励成员亲手设计实验装置、开展流体实验并编写数值模式，从理论、实验和数值模拟等不同角度，探索大气、海洋及旋转行星中流体运动的物理机制。
  research_label: 研究方向
  research:
    - index: "01"
      title: 台风生成实验模拟
      description: 利用可控的流体实验装置，对台风生成过程中的关键动力和热力机制进行理想化模拟。
    - index: "02"
      title: 波流相互作用
      description: 结合波浪水槽实验与数值模拟，研究波动与背景流相互影响的基本过程。
  outputs_title: 最新成果
  blog_title: 最新博客
  all_outputs: 查看全部成果
